
name: Block Major Dependency Jumps

on:
  pull_request:550
    paths:
      - package.json
      - pnpm-lock.yaml
      - package-lock.json
      - yarn.lock

permissions:
  contents: read

jobs:
  block-major-jump:
    name: Block major dependency updates
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Check for major version changes
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import re
          import sys

          SECTIONS = (
              "dependencies",
              "devDependencies",
              "optionalDependencies",
              "peerDependencies",
          )

          def parse_version(value):
              if not isinstance(value, str):
                  return None

              match = re.match(
                  r"^[\^~>=<v]*\s*(\d+)\.(\d+)\.(\d+)",
                  value.strip()
              )

              if not match:
                  return None

              return tuple(map(int, match.groups()))

          def load_dependencies(path):
              with open(path, encoding="utf-8") as file:
                  package = json.load(file)

              dependencies = {}

              for section in SECTIONS:
                  dependencies.update(package.get(section, {}))

              return dependencies

          base_deps = load_dependencies("base/package.json")
          head_deps = load_dependencies("head/package.json")

          blocked = []
          skipped = []

          for package in sorted(set(base_deps) & set(head_deps)):
              old_version = base_deps[package]
              new_version = head_deps[package]

              if old_version == new_version:
                  continue

              old_parsed = parse_version(old_version)
              new_parsed = parse_version(new_version)

              if old_parsed is None or new_parsed is None:
                  skipped.append(
                      f"{package}: {old_version} -> {new_version}"
                  )
                  continue

              if old_parsed[0] != new_parsed[0]:
                  blocked.append(
                      f"{package}: {old_version} -> {new_version}"
                  )

          if skipped:
              print("Versions requiring manual review:")
              for item in skipped:
                  print(f"  - {item}")

          if blocked:
              print("\nMajor dependency updates are blocked:")
              for item in blocked:
                  print(f"  - {item}")

              sys.exit(1)

          print("No major dependency updates detected.")
          PY
