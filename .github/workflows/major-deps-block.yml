
name: Block Major Dependency Jumps

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  block-major-jump:
    name: Block major dependency updates
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Check all direct dependencies
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import re
          import sys

          SECTIONS = [
              "dependencies",
              "devDependencies",
              "optionalDependencies",
              "peerDependencies",
          ]

          def load_package(path):
              with open(path, encoding="utf-8") as f:
                  return json.load(f)

          def get_dependencies(package):
              result = {}

              for section in SECTIONS:
                  for name, version in package.get(section, {}).items():
                      result[name] = version

              return result

          def parse_major(version):
              if not isinstance(version, str):
                  return None

              # Extract the first semantic version from a range.
              match = re.search(
                  r"(?<![a-zA-Z0-9])v?(\d+)\.(\d+)\.(\d+)",
                  version
              )

              if not match:
                  return None

              return int(match.group(1))

          base = get_dependencies(load_package("base/package.json"))
          head = get_dependencies(load_package("head/package.json"))

          blocked = []
          skipped = []

          for name in sorted(set(base) & set(head)):
              old = base[name]
              new = head[name]

              if old == new:
                  continue

              old_major = parse_major(old)
              new_major = parse_major(new)

              if old_major is None or new_major is None:
                  skipped.append(f"{name}: {old} -> {new}")
                  continue

              if old_major != new_major:
                  blocked.append(f"{name}: {old} -> {new}")

          if skipped:
              print("\nCould not determine these versions:")
              for item in skipped:
                  print(f"  - {item}")

          if blocked:
              print("\nMajor dependency upgrades blocked:")
              for item in blocked:
                  print(f"  - {item}")

              sys.exit(1)

          print("All declared direct dependencies passed.")
          PY
